[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "simulinterp"
version = "0.1.0"
description = "Offline German/English speech to Chinese subtitles for Windows"
requires-python = ">=3.10,<3.14"
dependencies = [
  "PySide6-Essentials==6.8.2.1",
  "numpy>=1.26,<3",
  "scipy>=1.13,<2",
  "faster-whisper==1.2.1",
  "ctranslate2==4.8.4",
  "transformers==4.51.3",
  "sentencepiece>=0.2,<0.3",
  "opencc-python-reimplemented>=0.1.7,<0.2",
  "PyAudioWPatch>=0.2.12.7,<0.3; sys_platform == 'win32'",
  "webrtcvad-wheels>=2.0.14,<3",
]

[project.optional-dependencies]
cuda = ["nvidia-cublas-cu12==12.6.4.1", "nvidia-cudnn-cu12==9.5.1.17"]
dev = ["pytest>=8,<10"]

[project.scripts]
simulinterp = "simulinterp.app:main"
simulinterp-prepare = "simulinterp.prepare_models:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
